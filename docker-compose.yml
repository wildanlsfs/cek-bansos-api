# DEPRECATED: Use docker-compose.ollama.yml or docker-compose.9router.yml instead
#
# Quick commands:
#   For Ollama:  docker compose -f docker-compose.ollama.yml up -d
#   For 9router: docker compose -f docker-compose.9router.yml up -d
#
# This file is kept for backward compatibility but new deployments
# should use the specific compose files.

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cek-bansos-api
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
    restart: unless-stopped
